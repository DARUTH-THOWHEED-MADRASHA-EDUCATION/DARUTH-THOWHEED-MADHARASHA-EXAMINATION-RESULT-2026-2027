
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daruth Thowheed Madrasha - Exam Results</title>

<style>
:root {
  --bg:#eef3f8;
  --card:#fff;
  --ink:#14213d;
  --mute:#5b6b82;
  --line:#d5dee9;
  --acc:#1d4ed8;
  --ok:#177245;
  --bad:#b42318;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:#0b5d3b radial-gradient(circle at 20% 0%,#1f8a5b 0,#0b5d3b 45%,#063d27 100%) fixed;
  min-height:100vh;
  color:var(--ink);
  font-family:"Segoe UI",system-ui,Arial,sans-serif;
  line-height:1.5;
}
main { max-width:560px; margin:auto; padding:24px 16px 40px; }
.hd {
  text-align:center;
  margin-bottom:16px;
  background:var(--card);
  border:3px double #c9a227;
  border-radius:14px;
  padding:18px 14px;
}
.hd img { display:block; margin:0 auto 10px; max-width:120px; height:auto; }
.bis { font-family:serif; font-size:1.5rem; color:var(--ok); }
.bt,.meta { font-size:.92rem; color:var(--mute); }
.bt { margin-bottom:8px; }
h1 { font-size:1.4rem; margin:0 0 6px; color:var(--ok); }
.org { font-weight:600; line-height:1.5; }
.qr {
  display:inline-block; margin-top:12px; padding:6px 16px;
  border-radius:99px; background:var(--acc); color:white; font-weight:700;
}
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
label { display:block; font-weight:600; margin-bottom:6px; }
input {
  width:100%; min-height:46px; font:inherit; padding:12px;
  border:1px solid var(--line); border-radius:8px;
  background:var(--bg); color:var(--ink);
}
.row { display:flex; gap:10px; margin-top:12px; }
button {
  font:inherit; font-weight:600; padding:12px 18px; border:0;
  border-radius:8px; background:var(--acc); color:white;
  cursor:pointer; flex:1;
}
button:disabled { opacity:.6; cursor:not-allowed; }
button.alt { background:transparent; color:var(--ink); border:1px solid var(--line); }
.err { color:var(--bad); margin-top:12px; }
#res { margin-top:18px; }
.head { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.head h2 { margin:0; font-size:1.25rem; }
.badge { font-weight:700; padding:4px 12px; border-radius:99px; border:2px solid currentColor; }
.pass { color:var(--ok); }
.fail { color:var(--bad); }
.tw { overflow-x:auto; }
table { width:100%; border-collapse:collapse; margin:8px 0; }
th,td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); }
td.n,th.n { text-align:right; }
tfoot td { font-weight:700; border-bottom:0; }
#release { margin-bottom:16px; }
.release-title { font-weight:700; font-size:1.1rem; }
@media print {
  body { background:white !important; color:#111; }
  main { max-width:100%; padding:0; }
  .noprint { display:none !important; }
  .hd,.card { border:1px solid #bbb; }
  #res { display:block !important; }
  .signatures {
    display:flex !important;
    justify-content:space-between;
    gap:12px;
    margin-top:65px;
    page-break-inside:avoid;
  }
  .signature { flex:1; text-align:center; font-size:11px; font-weight:700; }
}
.signatures { display:none; }
</style>
</head>

<body>
<main>

<header class="hd">
 <img src="https://daruth-thowheed-madrasha-education.github.io/DARUTH-THOWHEED-MADHARASHA-EXAMINATION-RESULT-2026-2027/madharasa-logo.jpg"
     alt="Daruth Thowheed Madrasha Logo"
     style="display:block;margin:0 auto 10px;width:120px;height:auto;">
  <div class="bis" dir="rtl" lang="ar">بسم الله الرحمن الرحيم</div>
  <div class="bt">Bismillahirrahmanirrahim</div>
  <h1>DARUTH THOWHEED MADRASHA</h1>
  <div class="org">
    TAMILNADU THOWHEED JAMATH<br>
    CHENGALPATTU WEST DISTRICT
  </div>
  <div class="qr">QUARTERLY EXAMINATION RESULT</div>
</header>

<section id="release" class="card">
  <div class="release-title" id="releaseTitle">RESULT NOT YET RELEASED</div>
  <p id="releaseMessage" aria-live="polite"></p>
</section>

<section id="login" class="card noprint" hidden>
  <label for="reg">Register number</label>
  <input id="reg" inputmode="numeric" autocomplete="off" placeholder="e.g. 260101">

  <label for="dob" style="margin-top:12px">Date of birth</label>
  <input id="dob" type="date">

  <div class="row">
    <button id="go" type="button">View result</button>
  </div>
  <div id="err" class="err" role="alert"></div>
</section>

<section id="res" class="card" hidden>
  <div class="head">
    <div>
      <h2 id="nm"></h2>
      <div class="meta" id="mt"></div>
    </div>
    <div class="badge" id="st"></div>
  </div>

  <div class="tw">
    <table>
      <thead>
        <tr><th>No</th><th>Subject</th><th class="n">Marks</th></tr>
      </thead>
      <tbody id="tb"></tbody>
      <tfoot>
        <tr><td></td><td>Total</td><td class="n" id="tt"></td></tr>
      </tfoot>
    </table>
  </div>

  <div class="meta" id="pc"></div>

  <div class="signatures">
    <div class="signature">PRINCIPAL</div>
    <div class="signature">THOORAMA EXAMINATION CONTROLLER</div>
    <div class="signature">VICE PRINCIPAL</div>
  </div>

  <div class="row noprint">
    <button class="alt" id="pr" type="button">Print result</button>
  </div>
</section>

</main>

<script src="config.js"></script>
<script>
"use strict";

const RELEASE_TIME = new Date("2026-10-23T17:00:00+05:30");
const PASS_MARK = 35;
const MAX_MARKS = 100;
const $ = id => document.getElementById(id);

function isReleased() {
  return Date.now() >= RELEASE_TIME.getTime();
}

function updateReleaseScreen() {
  if (isReleased()) {
    $("releaseTitle").textContent = "RESULT RELEASED";
    $("releaseMessage").textContent =
      "Results are now available. Enter your register number and date of birth.";
    $("login").hidden = false;
  } else {
    $("releaseTitle").textContent = "RESULT NOT YET RELEASED";
    $("releaseMessage").textContent =
      "Quarterly examination results will be available from 23 October 2026 at 5:00 PM IST.";
    $("login").hidden = true;
    $("res").hidden = true;
  }
}

async function showResult() {
  $("err").textContent = "";
  $("res").hidden = true;

  if (!isReleased()) {
    updateReleaseScreen();
    return;
  }

  const reg = $("reg").value.trim();
  const dob = $("dob").value;

  if (!reg || !dob) {
    $("err").textContent = "Enter your register number and date of birth.";
    return;
  }

  if (typeof SCRIPT_URL === "undefined" ||
      !SCRIPT_URL ||
      SCRIPT_URL.includes("PASTE")) {
    $("err").textContent = "Website connection is not configured. Check config.js.";
    return;
  }

  $("go").disabled = true;
  $("go").textContent = "Checking...";

  try {
    const url = SCRIPT_URL +
      "?reg=" + encodeURIComponent(reg) +
      "&dob=" + encodeURIComponent(dob);

    const response = await fetch(url, { cache: "no-store" });
    const data = await response.json();

    if (!data.ok) {
      $("err").textContent = data.msg || "Result not found.";
      return;
    }

    // Recheck in case the release time has not arrived.
    if (!isReleased()) {
      updateReleaseScreen();
      return;
    }

    const theory = Number(data.theory);
    const internal = Number(data.internal);

    if (!Number.isFinite(theory) || !Number.isFinite(internal)) {
      $("err").textContent = "Invalid marks received. Please contact the administrator.";
      return;
    }

    const total = theory + internal;
    const passed = total >= PASS_MARK;

    $("nm").textContent = data.name || "";
    $("mt").textContent = "Reg. no. " + reg + " | " + (data.year || "");
    $("tb").innerHTML =
      "<tr><td>1</td><td>Theory</td><td class='n'>" + theory + "</td></tr>" +
      "<tr><td>2</td><td>Internal Mark</td><td class='n'>" + internal + "</td></tr>";

    $("tt").textContent = total + " / " + MAX_MARKS;
    $("pc").textContent =
      "Percentage: " + (total / MAX_MARKS * 100).toFixed(1) + "%";

    $("st").textContent = passed ? "PASS" : "FAIL";
    $("st").className = "badge " + (passed ? "pass" : "fail");
    $("res").hidden = false;

  } catch (error) {
    $("err").textContent = "Could not load results. Check your internet and try again.";
  } finally {
    $("go").disabled = false;
    $("go").textContent = "View result";
  }
}

$("go").addEventListener("click", showResult);
$("reg").addEventListener("keydown", event => {
  if (event.key === "Enter") showResult();
});
$("pr").addEventListener("click", () => window.print());

updateReleaseScreen();
</script>
</body>
</html>
